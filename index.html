<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>締切カウントダウンボード</title>
<style>
  :root {
    --bg: #F2D9A0;
    --surface: #FFFFFF;
    --text-main: #3A2E14;
    --text-sub: #7A6B45;
    --accent: #B8791E;
    --danger: #C0392B;
    --border: #E0C182;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text-main);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }
  .form-card {
    margin-bottom: 24px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 16px;
  }
  .field:last-of-type {
    margin-bottom: 0;
  }
  label {
    font-size: 14px;
    color: var(--text-sub);
  }
  input[type="text"],
  input[type="date"] {
    font-size: 16px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-main);
    width: 100%;
  }
  input[type="text"]:focus,
  input[type="date"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    font-size: 16px;
    font-family: inherit;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #addBtn {
    width: 100%;
    padding: 12px;
    margin-top: 16px;
    background: var(--accent);
    color: #FFFFFF;
    font-weight: 700;
    min-height: 44px;
  }
  #addBtn:active {
    opacity: 0.85;
  }
  .error {
    color: var(--danger);
    font-size: 14px;
    margin-top: 8px;
    min-height: 0;
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .item {
    display: grid;
    grid-template-areas:
      "name badge"
      "date delete";
    grid-template-columns: 1fr auto;
    row-gap: 8px;
    column-gap: 8px;
    align-items: center;
  }
  .item-name {
    grid-area: name;
    font-size: 16px;
    font-weight: 700;
    min-width: 0;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .item-date {
    grid-area: date;
    font-size: 14px;
    color: var(--text-sub);
    min-width: 0;
  }
  .badge {
    grid-area: badge;
    justify-self: end;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    background: var(--border);
    color: var(--text-main);
  }
  .badge.danger {
    background: var(--danger);
    color: #FFFFFF;
  }
  .delete-btn {
    grid-area: delete;
    justify-self: end;
    padding: 8px 14px;
    min-height: 40px;
    min-width: 40px;
    background: var(--surface);
    color: var(--danger);
    border: 1px solid var(--danger);
    font-size: 14px;
  }
  .delete-btn:active {
    background: #FBEAE8;
  }
  .empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    padding: 32px 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>締切カウントダウンボード</h1>

  <div class="card form-card">
    <div class="field">
      <label for="nameInput">案件名</label>
      <input type="text" id="nameInput" placeholder="例: A社サイト制作">
    </div>
    <div class="field">
      <label for="dateInput">期日</label>
      <input type="date" id="dateInput">
    </div>
    <button id="addBtn" type="button">追加</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none;">登録された案件はありません</div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'deadline-countdown-board.items';
  var nameInput = document.getElementById('nameInput');
  var dateInput = document.getElementById('dateInput');
  var addBtn = document.getElementById('addBtn');
  var errorMsg = document.getElementById('errorMsg');
  var listEl = document.getElementById('list');
  var emptyMsg = document.getElementById('emptyMsg');

  var DATE_ONLY_RE = /^\d{4}-\d{2}-\d{2}$/;

  function isValidItem(item) {
    return (
      item &&
      typeof item === 'object' &&
      (typeof item.id === 'string' || typeof item.id === 'number') &&
      typeof item.name === 'string' &&
      item.name.trim() !== '' &&
      typeof item.date === 'string' &&
      DATE_ONLY_RE.test(item.date)
    );
  }

  function loadItems() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(isValidItem);
    } catch (e) {
      return [];
    }
  }

  function saveItems(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function todayMidnight() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function parseDateOnly(dateStr) {
    var parts = dateStr.split('-');
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }

  function remainingDays(dateStr) {
    var target = parseDateOnly(dateStr);
    var today = todayMidnight();
    var diffMs = target.getTime() - today.getTime();
    return Math.round(diffMs / (1000 * 60 * 60 * 24));
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    var d = parseDateOnly(dateStr);
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }

  function render() {
    var items = loadItems();

    items.sort(function (a, b) {
      return remainingDays(a.date) - remainingDays(b.date);
    });

    listEl.innerHTML = '';

    if (items.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    items.forEach(function (item) {
      var days = remainingDays(item.date);
      var badgeText;
      var isDanger;

      if (days < 0) {
        badgeText = Math.abs(days) + '日超過';
        isDanger = true;
      } else if (days === 0) {
        badgeText = '本日締切';
        isDanger = true;
      } else {
        badgeText = 'あと' + days + '日';
        isDanger = days <= 3;
      }

      var itemEl = document.createElement('div');
      itemEl.className = 'card item';
      itemEl.innerHTML =
        '<div class="item-name">' + escapeHtml(item.name) + '</div>' +
        '<div class="badge' + (isDanger ? ' danger' : '') + '">' + badgeText + '</div>' +
        '<div class="item-date">' + escapeHtml(formatDate(item.date)) + '</div>' +
        '<button type="button" class="delete-btn" data-id="' + escapeHtml(String(item.id)) + '">削除</button>';

      listEl.appendChild(itemEl);
    });

    Array.prototype.forEach.call(listEl.querySelectorAll('.delete-btn'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        var remaining = loadItems().filter(function (it) {
          return String(it.id) !== String(id);
        });
        saveItems(remaining);
        render();
      });
    });
  }

  function addItem() {
    var name = nameInput.value.trim();
    var date = dateInput.value;

    if (!name || !date) {
      errorMsg.textContent = '案件名と期日を入力してください';
      return;
    }
    errorMsg.textContent = '';

    var items = loadItems();
    items.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      name: name,
      date: date
    });
    saveItems(items);

    nameInput.value = '';
    dateInput.value = '';
    render();
  }

  addBtn.addEventListener('click', addItem);

  render();
})();
</script>
</body>
</html>
